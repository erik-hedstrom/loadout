name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` starts the full matrix when `ci-full` is added.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Private-repo minutes bill macOS at 10x and Windows at 2x. They run while a PR has the
        # `ci-full` label, added once reviews approve, so pushes after that rerun them; macOS
        # caught /var realpath bugs three times. Pushes to main run Ubuntu only.
        os: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-full') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install sandbox test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap passt
      - name: Allow sandbox user namespaces on the ephemeral runner
        if: runner.os == 'Linux'
        # Ubuntu 24.04 restricts unprivileged user namespaces by default.
        # https://documentation.ubuntu.com/release-notes/24.04/#unprivileged-user-namespace-restrictions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          B11_TEST_INTERNET: '1'

  build-without-optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run build
      - run: npm run typecheck
