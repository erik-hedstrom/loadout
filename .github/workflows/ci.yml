name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` starts the full matrix when `ci-full` is added.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Private-repo minutes bill macOS at 10x and Windows at 2x, so they run once per PR,
        # when the `ci-full` label is added before merge (macOS caught /var realpath bugs
        # three times). Pushes to main run Ubuntu only: the merged head already passed.
        os: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'ci-full') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  build-without-optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run build
      - run: npm run typecheck
