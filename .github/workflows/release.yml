name: Release

# Runs only when a version tag is pushed. Nothing here publishes until the `npm-release`
# environment (required reviewer: Erik) approves the publish job. Setup steps: CONTRIBUTING.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag is on main and matches package.json and CHANGELOG
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
          grep -Eq "^## \[?${version//./\\.}\]?( |$)" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install sandbox test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap passt
          # Same reason as ci.yml: Ubuntu 24.04 restricts unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Pauses for approval; the NPM_TOKEN secret lives in this environment, not in the repository.
    environment: npm-release
    permissions:
      contents: write # creates the GitHub release
      id-token: write # signs the provenance statement
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # No install scripts run before the token is in the environment of the publish step.
      - run: npm ci --ignore-scripts
      - name: Publish to npm with provenance
        # A prerelease version needs an explicit dist-tag, so it never becomes `latest`.
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v || $2 == "[" v "]") { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::empty release notes for $version"; exit 1; }
          case "$version" in *-*) flag=--prerelease ;; *) flag= ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" $flag
        env:
          GH_TOKEN: ${{ github.token }}
