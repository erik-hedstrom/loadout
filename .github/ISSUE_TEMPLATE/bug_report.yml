name: Bug report
description: Report unexpected loadout behavior.
body:
  - type: markdown
    attributes:
      value: Do not paste keys or MCP configs. Remove credentials from commands and output. Report security vulnerabilities through private reporting linked in SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Include loadout --version output (including the error if unsupported), OS, and host agent or app with its version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Command and reproduction steps
      description: Include the exact command, steps, and sanitized output.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
