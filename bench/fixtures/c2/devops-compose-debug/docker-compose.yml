services:
  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app:example@localhost:5432/app
      REDIS_URL: redis://cache:6379
      PORT: 3000
    depends_on:
      - db
      - cache

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: example
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgres

  cache:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  dbdata:
